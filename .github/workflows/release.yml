name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: windows
            goarch: arm64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      # Checkout all repos side by side
      - name: Checkout apteva (CLI)
        uses: actions/checkout@v4
        with:
          path: apteva

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: apteva/core
          path: core
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: apteva/server
          path: server
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout computer
        uses: actions/checkout@v4
        with:
          repository: apteva/computer
          path: computer
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          repository: apteva/dashboard
          path: dashboard
          token: ${{ secrets.REPO_TOKEN }}

      # ui-kit is consumed by dashboard/build.ts (panel importmap).
      # Without it the dashboard build fails:
      #   "Module not found .../ui-kit/scripts/build.ts".
      - name: Checkout ui-kit
        uses: actions/checkout@v4
        with:
          repository: apteva/ui-kit
          path: ui-kit
          token: ${{ secrets.REPO_TOKEN }}

      # app-sdk is consumed by server/go.mod via `replace ../app-sdk`.
      # Without it `go build` in server/ fails immediately.
      - name: Checkout app-sdk
        uses: actions/checkout@v4
        with:
          repository: apteva/app-sdk
          path: app-sdk
          token: ${{ secrets.REPO_TOKEN }}

      # integrations produces the per-app UI panels that server/ embeds
      # via //go:embed integrations-ui. Without this step the embed is
      # empty (still compiles — the embed root has a .gitkeep — but
      # every integration UI route 404s).
      - name: Checkout integrations
        uses: actions/checkout@v4
        with:
          repository: apteva/integrations
          path: integrations
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        shell: bash
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../server/dashboard
          cp -r dist/* ../server/dashboard/

      - name: Build integration UI bundles
        shell: bash
        run: |
          cd integrations
          bun install --frozen-lockfile
          bun run scripts/build-ui.ts
          mkdir -p ../server/integrations-ui
          # Per-slug bundles land under dist/ui; copy each into the
          # server's embed tree. Empty result is fine — the embed root
          # has a .gitkeep so the directive succeeds either way.
          if [ -d dist/ui ]; then
            cp -r dist/ui/* ../server/integrations-ui/ 2>/dev/null || true
          fi

      - name: Build binaries
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Mirror scripts/release.sh: set every -X target the server
          # main package exposes. Cli + core ignore the unknown ones
          # silently. Drives /health output and the dashboard's
          # platform-update pill — without these, components show as
          # "dev" and update detection skips them.
          DASH_VER=$(jq -r .version dashboard/package.json)
          INT_VER=$(jq -r .version integrations/package.json)
          LDFLAGS="-s -w \
            -X main.Version=${VERSION} \
            -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X main.CLIVersion=${VERSION} \
            -X main.DashboardVersion=${DASH_VER} \
            -X main.IntegrationsVersion=${INT_VER} \
            -X main.CoreVersion=${VERSION}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          mkdir -p dist

          echo "Building core..."
          cd core
          # core's main package is under ./cmd/apteva-core (matches
          # scripts/build-local.sh). Building `.` here would compile
          # the package's library code, not produce the binary.
          go build -ldflags="$LDFLAGS" -o "../dist/apteva-core${EXT}" ./cmd/apteva-core
          cd ..

          echo "Building server..."
          cd server
          go build -ldflags="$LDFLAGS" -o "../dist/apteva-server${EXT}" .
          cd ..

          echo "Building cli..."
          cd apteva
          go build -ldflags="$LDFLAGS" -o "../dist/apteva${EXT}" .
          cd ..

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARNAME="apteva-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          cd dist
          tar -czf "../${TARNAME}" .
          cd ..
          ls -lh "${TARNAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apteva-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apteva-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update package version
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
