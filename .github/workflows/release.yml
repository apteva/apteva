name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      # Match scripts/release.sh: linux + darwin × amd64/arm64. Windows
      # was previously in the matrix but Apteva relies on unix-y paths
      # (sockets, /tmp, exec semantics) and Bun-on-Windows path quirks
      # break the dashboard build (`Module not found "/D:/a/.../ui-kit/
      # scripts/build.ts"`). install.js maps win32→windows in
      # PLATFORM_MAP so npm fetch would still try to download a Windows
      # tarball — but since we don't ship one, that path is dead too.
      # Re-add when there's real demand and the path issues are sorted.
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      # Checkout all repos side by side
      - name: Checkout apteva (CLI)
        uses: actions/checkout@v4
        with:
          path: apteva

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: apteva/core
          path: core
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: apteva/server
          path: server
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout computer
        uses: actions/checkout@v4
        with:
          repository: apteva/computer
          path: computer
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          repository: apteva/dashboard
          path: dashboard
          token: ${{ secrets.REPO_TOKEN }}

      # ui-kit is consumed by dashboard/build.ts (panel importmap).
      # Without it the dashboard build fails:
      #   "Module not found .../ui-kit/scripts/build.ts".
      - name: Checkout ui-kit
        uses: actions/checkout@v4
        with:
          repository: apteva/ui-kit
          path: ui-kit
          token: ${{ secrets.REPO_TOKEN }}

      # app-sdk is consumed by server/go.mod via `replace ../app-sdk`.
      # Without it `go build` in server/ fails immediately.
      - name: Checkout app-sdk
        uses: actions/checkout@v4
        with:
          repository: apteva/app-sdk
          path: app-sdk
          token: ${{ secrets.REPO_TOKEN }}

      # integrations produces the per-app UI panels that server/ embeds
      # via //go:embed integrations-ui. Without this step the embed is
      # empty (still compiles — the embed root has a .gitkeep — but
      # every integration UI route 404s).
      - name: Checkout integrations
        uses: actions/checkout@v4
        with:
          repository: apteva/integrations
          path: integrations
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get build time
        id: build_time
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ui-kit's build is invoked by dashboard/build.ts (panel
      # importmap), so its node_modules must be populated before
      # the dashboard build runs. Without this step the ui-kit
      # build dies on `error: Could not resolve "lucide-react"`.
      - name: Install ui-kit deps
        shell: bash
        run: |
          cd ui-kit
          bun install

      - name: Build dashboard
        shell: bash
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../server/dashboard
          cp -r dist/* ../server/dashboard/

      - name: Build integration UI bundles
        shell: bash
        run: |
          cd integrations
          bun install --frozen-lockfile
          bun run scripts/build-ui.ts
          mkdir -p ../server/integrations-ui
          # Per-slug bundles land under dist/ui; copy each into the
          # server's embed tree. Empty result is fine — the embed root
          # has a .gitkeep so the directive succeeds either way.
          if [ -d dist/ui ]; then
            cp -r dist/ui/* ../server/integrations-ui/ 2>/dev/null || true
          fi

      - name: Sync integration catalog JSONs into server/integrations-catalog/
        shell: bash
        run: |
          # v0.13.1+ embeds integrations/src/apps/*.json into the
          # server binary so `apteva update` ships a fresh catalog
          # alongside the fresh server. Pre-v0.13.1 the catalog only
          # existed on disk (downloaded once at first boot) and
          # operators kept seeing stale JSONs after binary upgrades.
          # Mirrors the integrations-ui sync above.
          mkdir -p server/integrations-catalog
          if [ -d integrations/src/apps ]; then
            cp -f integrations/src/apps/*.json server/integrations-catalog/ 2>/dev/null || true
          fi

      - name: Build binaries
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Mirror scripts/release.sh: set every -X target the server
          # main package exposes. Cli + core ignore the unknown ones
          # silently. Drives /health output and the dashboard's
          # platform-update pill — without these, components show as
          # "dev" and update detection skips them.
          DASH_VER=$(jq -r .version dashboard/package.json)
          INT_VER=$(jq -r .version integrations/package.json)
          LDFLAGS="-s -w \
            -X main.Version=${VERSION} \
            -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X main.CLIVersion=${VERSION} \
            -X main.DashboardVersion=${DASH_VER} \
            -X main.IntegrationsVersion=${INT_VER} \
            -X main.CoreVersion=${VERSION}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          mkdir -p dist

          echo "Building core..."
          cd core
          # core's main package is under ./cmd/apteva-core (matches
          # scripts/build-local.sh). Building `.` here would compile
          # the package's library code, not produce the binary.
          go build -ldflags="$LDFLAGS" -o "../dist/apteva-core${EXT}" ./cmd/apteva-core
          cd ..

          echo "Building server..."
          cd server
          go build -ldflags="$LDFLAGS" -o "../dist/apteva-server${EXT}" .
          cd ..

          echo "Building cli..."
          cd apteva
          go build -ldflags="$LDFLAGS" -o "../dist/apteva${EXT}" .
          cd ..

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARNAME="apteva-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          cd dist
          tar -czf "../${TARNAME}" .
          cd ..
          ls -lh "${TARNAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apteva-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apteva-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

      # Bump version.json on main so the dashboard's update-available
      # pill stops claiming an update is needed when users are
      # already on the version we just shipped. This used to be a
      # manual step that got forgotten — every release where
      # someone forgot left every existing install showing
      # "update available" against a version that no longer exists.
      # We compute sha256 from the tarballs we just downloaded as
      # release artifacts, write a new version.json, and push it
      # back to main with the GITHUB_TOKEN. dashboard/integrations
      # versions come from the repos themselves at tag time.
      - name: Update version.json on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Pull the dashboard / integrations versions out of their
          # repos at tag time. REPO_TOKEN is the same cross-repo
          # token the build job uses for sibling checkouts.
          DASH_VER=$(curl -fsSL \
            -H "Authorization: token ${REPO_TOKEN}" \
            "https://raw.githubusercontent.com/apteva/dashboard/main/package.json" \
            | jq -r .version)
          INT_VER=$(curl -fsSL \
            -H "Authorization: token ${REPO_TOKEN}" \
            "https://raw.githubusercontent.com/apteva/integrations/main/package.json" \
            | jq -r .version)
          DARWIN_ARM64=$(sha256sum "artifacts/apteva-${VERSION}-darwin-arm64.tar.gz" | awk '{print $1}')
          DARWIN_AMD64=$(sha256sum "artifacts/apteva-${VERSION}-darwin-amd64.tar.gz" | awk '{print $1}')
          LINUX_ARM64=$(sha256sum "artifacts/apteva-${VERSION}-linux-arm64.tar.gz" | awk '{print $1}')
          LINUX_AMD64=$(sha256sum "artifacts/apteva-${VERSION}-linux-amd64.tar.gz" | awk '{print $1}')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry loop. Pre-v0.12.3 this was a try-then-rebase shape
          # that deadlocked on version.json merge conflicts (both sides
          # edit the same file every release) AND silently exit-0'd via
          # `git rebase --abort` returning 0, leaving "Update version.
          # json on main" green while the manifest stayed stale. v0.12.3
          # rewrites it as: each attempt resets to origin/main, writes
          # the file fresh, commits, and pushes. If that loses a race
          # we just start over from origin/main next iteration. Final
          # `exit 1` ensures permanent failure surfaces in the run
          # status.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cat > version.json <<EOF
          {
            "schema": "apteva-platform/v1",
            "version": "${VERSION}",
            "released_at": "${NOW}",
            "release_notes_url": "https://github.com/apteva/apteva/releases/tag/v${VERSION}",
            "components": {
              "apteva":              "${VERSION}",
              "apteva-server":       "${VERSION}",
              "apteva-core":         "${VERSION}",
              "apteva-dashboard":    "${DASH_VER}",
              "apteva-integrations": "${INT_VER}"
            },
            "artifacts": {
              "darwin-arm64": {
                "url":    "https://github.com/apteva/apteva/releases/download/v${VERSION}/apteva-${VERSION}-darwin-arm64.tar.gz",
                "sha256": "${DARWIN_ARM64}"
              },
              "darwin-amd64": {
                "url":    "https://github.com/apteva/apteva/releases/download/v${VERSION}/apteva-${VERSION}-darwin-amd64.tar.gz",
                "sha256": "${DARWIN_AMD64}"
              },
              "linux-arm64": {
                "url":    "https://github.com/apteva/apteva/releases/download/v${VERSION}/apteva-${VERSION}-linux-arm64.tar.gz",
                "sha256": "${LINUX_ARM64}"
              },
              "linux-amd64": {
                "url":    "https://github.com/apteva/apteva/releases/download/v${VERSION}/apteva-${VERSION}-linux-amd64.tar.gz",
                "sha256": "${LINUX_AMD64}"
              }
            }
          }
          EOF

            git add version.json
            if git diff --cached --quiet; then
              echo "version.json already at v${VERSION} on origin/main — nothing to push"
              exit 0
            fi
            git commit -m "v${VERSION}: bump version.json (auto)"
            if git push origin HEAD:main; then
              echo "pushed version.json bump on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}, retrying…"
          done
          echo "::error::Update version.json on main failed after 5 attempts" >&2
          exit 1

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update package version
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Idempotency check — humans sometimes publish from their
      # laptop before the workflow finishes. Without this guard the
      # job's `npm publish` 403s on "version already published" and
      # the run shows red even though everything is on npmjs.
      - name: Check if version already published
        id: check
        run: |
          if npm view "apteva@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "apteva@${{ steps.version.outputs.version }} is already on npm — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.already_published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout apteva (CLI)
        uses: actions/checkout@v4
        with:
          path: apteva

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: apteva/core
          path: core
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: apteva/server
          path: server
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout computer
        uses: actions/checkout@v4
        with:
          repository: apteva/computer
          path: computer
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          repository: apteva/dashboard
          path: dashboard
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout ui-kit
        uses: actions/checkout@v4
        with:
          repository: apteva/ui-kit
          path: ui-kit
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout app-sdk
        uses: actions/checkout@v4
        with:
          repository: apteva/app-sdk
          path: app-sdk
          token: ${{ secrets.REPO_TOKEN }}

      - name: Checkout integrations
        uses: actions/checkout@v4
        with:
          repository: apteva/integrations
          path: integrations
          token: ${{ secrets.REPO_TOKEN }}

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get build time
        id: build_time
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apteva/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APTEVA_VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
          tags: |
            ghcr.io/apteva/apteva:${{ steps.version.outputs.version }}
            ghcr.io/apteva/apteva:latest
